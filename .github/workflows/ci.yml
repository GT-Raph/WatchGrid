# Pipeline stages 2-5 of Section 28.1: locked dependencies, lint/format checks,
# unit/integration/security/performance/e2e tests on PostgreSQL, dependency scans and
# immutable image builds. Deployment to staging/production is handled by the release
# workflow once those environments exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: watchgrid
          POSTGRES_USER: watchgrid
          POSTGRES_PASSWORD: watchgrid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U watchgrid" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://watchgrid:watchgrid@localhost:5432/watchgrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/development.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Static assets (hashed manifest, as in production)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-static-build-key-not-a-secret
        run: python manage.py collectstatic --noinput
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: pytest
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements/production.txt

  images:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Django image (web, workers, beat)
        run: docker build -f docker/django/Dockerfile -t watchgrid-django:${{ github.sha }} .
      - name: Build Nginx edge image
        run: docker build -t watchgrid-nginx:${{ github.sha }} docker/nginx
