# WatchGrid edge: reverse proxy to Django templates and the API.
# TLS is terminated in front of this container (load balancer, Cloudflare or a
# TLS-enabled Nginx); X-Forwarded-Proto must be "https" in production so Django
# sets Secure cookies and HSTS (NFR-SEC-001).

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
limit_req_zone $http_x_project_key zone=ingest_per_key:10m rate=50r/s;

# Keep the scheme reported by an upstream TLS terminator; fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/v1/events/errors/ {
        limit_req zone=ingest_per_key burst=200 nodelay;
        client_max_body_size 300k;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location ~ ^/api/v1/auth/(login|register|password-reset)/ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /admin/ {
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /health/ {
        access_log off;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/(login|register|forgot-password|reset-password)/ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy_params.inc;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
