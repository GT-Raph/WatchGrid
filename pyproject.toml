[project]
name = "watchgrid"
version = "1.0.0"
description = "Web and Application Monitoring Platform"
requires-python = ">=3.10"

[tool.coverage.run]
source = ["apps", "common"]
branch = true
omit = ["*/migrations/*", "*/admin.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*", "tmp", "media", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",    # assert is fine in tests
    "S311",    # random is used for scheduling jitter, not security
    "B904",    # explicit exception chaining enforced by review instead
    "RUF012",  # DRF class attributes are intentionally mutable
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S108", "S110", "B017"]
"config/settings/*" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["api", "apps", "common", "config", "tests"]
